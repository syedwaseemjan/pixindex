[project]
name = "pixindex"
version = "0.1.0"
description = "Index pictures, search by what they show, find copies, and export the catalog."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Waseem Jan" }]
dependencies = [
    "boto3>=1.34",
    "pillow>=10.0",
    "typer>=0.12",
]

[project.optional-dependencies]
embed = [
    "fastembed>=0.6",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pixindex = "pixindex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
